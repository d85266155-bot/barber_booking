<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barber App</title>
<meta name="theme-color" content="#0e0f12">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>:root{--font-display:"Space Grotesk",system-ui,-apple-system,sans-serif;--font-body:"Inter",system-ui,-apple-system,sans-serif;--bg:#0e0f12;--surface:#17181c;--surface2:#22242a;--fg:#ececec;--muted:#a6a8b0;--line:#2a2c33;--gold:#d4af37;--on-gold:#1a1500;--gold-soft:#3a3115;--gold-text:#f3dd8a;--wa:#25d366;--on-wa:#07210f;--danger:#ff6b6b;color-scheme:dark;}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}html{background:var(--bg);}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-body);padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(40px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));}[hidden]{display:none !important;}main{max-width:480px;margin:0 auto;display:grid;gap:16px;}h1{margin:0;font:700 28px/1.15 var(--font-display);color:var(--gold);letter-spacing:-.01em;text-wrap:balance;}.sub{margin:4px 0 0;color:var(--muted);}.box{background:var(--surface);border-radius:20px;padding:16px;display:grid;gap:12px;min-width:0;}.lbl{font-size:13px;color:var(--muted);font-weight:500;}.chips{display:flex;flex-wrap:wrap;gap:8px;}.chip{min-height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:transparent;font:inherit;color:var(--fg);cursor:pointer;font-variant-numeric:tabular-nums;}.chip[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold-text);border-color:var(--gold);}.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}.strip::-webkit-scrollbar{display:none;}.day{flex:none;border:0;border-radius:16px;background:var(--surface2);color:var(--fg);padding:10px 14px;text-align:center;min-width:58px;font:inherit;cursor:pointer;}.day small{display:block;font-size:12px;color:var(--muted);}.day strong{font:700 18px var(--font-display);}.day[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);}.day[aria-pressed="true"] small{color:var(--on-gold);}input[type="text"],input[type="tel"]{width:100%;min-height:48px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:0 12px;font:16px var(--font-body);color:var(--fg);}:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}.send{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:16px;background:var(--wa);color:var(--on-wa);font:700 17px var(--font-display);text-decoration:none;}.send[aria-disabled="true"]{opacity:.4;pointer-events:none;}.preview{white-space:pre-wrap;background:var(--surface2);border-radius:12px;padding:12px;font-size:14px;color:var(--muted);}.warn{background:#3a1f1f;color:var(--danger);border-radius:14px;padding:12px 14px;font-size:14px;}.note{margin:0;font-size:12px;color:var(--muted);}.err{background:#3a1f1f;color:var(--danger);border-radius:14px;padding:12px 14px;font-size:14px;}.ok{background:#1c3a26;color:#9be3b0;border-radius:14px;padding:16px;font-size:16px;}.btn{display:flex;align-items:center;justify-content:center;min-height:54px;border:0;border-radius:16px;background:var(--gold);color:var(--on-gold);font:700 17px var(--font-display);cursor:pointer;width:100%;}.btn:disabled{opacity:.4;cursor:default;}.chip.off{display:none;}.person{display:grid;gap:8px;padding:10px 12px;border-radius:14px;background:var(--surface2);}.prow{display:flex;align-items:center;justify-content:space-between;gap:8px;}.link{background:none;border:0;color:var(--gold-text);font:inherit;cursor:pointer;padding:6px 0;text-align:left;}.rm{margin-left:auto;background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;min-height:40px;padding:0 8px;}.total{background:var(--gold-soft);color:var(--gold-text);border-radius:12px;padding:10px 12px;font-size:14px;}.red{color:#ff4d4d;font-weight:700;font-size:15px;background:#3a1f1f;border-radius:14px;padding:12px 14px;margin:0;}.info{display:grid;gap:6px;font-size:14px;}.info a{color:var(--gold-text);}.lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px}.lang button{min-height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}.lang button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:600}</style>
</head>
<body>
<main>
<header>
<div class="lang" id="lang"><button type="button" data-l="kk">ҚАЗ</button><button type="button" data-l="ru">РУС</button></div>
<h1 data-t="title">Шаштаразға жазылу</h1>
<p class="sub" data-t="sub">x</p>
</header>
<p class="red" data-t="red">x</p>
<section class="box" id="pick" hidden>
<div class="lbl" data-t="master">x</div>
<div class="chips" id="masters"></div>
</section>
<div id="form" style="display:grid;gap:16px">
<section class="box">
<div class="lbl" data-t="who">x</div>
<div id="persons" style="display:grid;gap:8px"></div>
<button class="link" id="addp" type="button" data-t="add">x</button>
</section>
<section class="box">
<div class="lbl" data-t="day">x</div>
<div class="strip" id="days"></div>
<div class="lbl" data-t="time">x</div>
<div class="chips" id="times"></div>
</section>
<section class="box">
<label class="lbl" style="display:grid;gap:6px"><span data-t="name">x</span>
<input type="text" id="name" autocomplete="name" placeholder="Мысалы, Нұрлан" maxlength="50">
</label>
<label class="lbl" style="display:grid;gap:6px"><span data-t="phone">x</span>
<input type="tel" id="phone" autocomplete="tel" placeholder="8 777 123 45 67" maxlength="20">
</label>
<a class="btn" id="go" aria-disabled="true" style="display:block;text-align:center;text-decoration:none;line-height:48px" data-t="go">x</a>
<p class="note" data-t="note">x</p>
<p class="red" data-t="red">x</p>
</section>
</div>
<section class="box info">
<div>📍 <span id="addr"></span> · <a id="map" target="_blank" rel="noopener" data-t="map">x</a></div>
<div>📞 <span id="master"></span>: <a id="tel"></a></div>
</section>
</main>
<script>
var ADDRESS = "Астана 5/1, «Saltanat space» салоны";
var MAP_URL = "https://2gis.kz/uralsk/geo/70000001040765501";
var MASTERS = {
asylkan: { name: "Асылкан", phone: "+77774763503", wk: [17, 22], we: [9, 22], off: [] },
ali: { name: "Али", phone: "+77769130007", wk: [17, 22], we: [9, 22], off: [] },
arsen: { name: "Арсен", phone: "+77714831237", off: [] }
};
var OPEN = 9 * 60, CLOSE = 22 * 60, MAX_PERSONS = 3;
var HOL = ["01-01","01-02","01-07","03-08","03-21","03-22","03-23","05-01","05-07","05-09","07-06","08-30","10-25","12-16","12-17","2026-05-27","2027-05-17"];
function isHol(k) { return HOL.indexOf(k.slice(5)) >= 0 || HOL.indexOf(k) >= 0; }
var TX = {
kk: { title: "Шаштаразға жазылу", sub: "Күн мен уақытты таңдаңыз. Батырманы басқанда шеберге WhatsApp-та хабар ашылады. Жазылу шебер растағаннан кейін күшіне енеді.",
red: "Келе алмайтын болсаңыз, шеберге алдын ала хабарласыңыз!", master: "Шебер", who: "Кім келеді?", add: "+ Тағы адам қосу", day: "Күні", time: "Қалаған уақыт",
name: "Атыңыз", phone: "Телефоныңыз", go: "WhatsApp-та жазу", note: "Шебер жауап бергенше жазылу расталмайды.", map: "2GIS картасынан ашу",
nph: "Мысалы, Нұрлан", addr: "Астана 5/1, «Saltanat space» салоны", one: "Келетін адам", nth: "-адам", rm: "Өшіру", adult: "Ересек", child: "Бала (13 жасқа дейін)",
none: "Бұл күнге уақыт қалмады. Басқа күнді таңдаңыз.", hello: "Сәлем, ", want: "! Жазылғым келеді.", dl: "Күні: ", tl: "Уақыты: ", min: " мин", wl: "Кім келеді: ", nl: "Атыңыз: ", pl: "Телефон: ", ok: "Жарай ма?",
a: " ересек", c: " бала", mn: "Шебер",
WD: ["жс", "дс", "сс", "ср", "бс", "жм", "сб"], WDF: ["жексенбі", "дүйсенбі", "сейсенбі", "сәрсенбі", "бейсенбі", "жұма", "сенбі"],
MF: ["қаңтар", "ақпан", "наурыз", "сәуір", "мамыр", "маусым", "шілде", "тамыз", "қыркүйек", "қазан", "қараша", "желтоқсан"] },
ru: { title: "Запись к барберу", sub: "Выберите день и время. При нажатии кнопки откроется сообщение мастеру в WhatsApp. Запись действует после подтверждения мастера.",
red: "Если не сможете прийти, заранее сообщите мастеру!", master: "Мастер", who: "Кто придёт?", add: "+ Добавить человека", day: "Дата", time: "Желаемое время",
name: "Ваше имя", phone: "Ваш телефон", go: "Написать в WhatsApp", note: "Запись не подтверждена, пока мастер не ответит.", map: "Открыть в 2GIS",
nph: "Например, Нурлан", addr: "Астана 5/1, салон «Saltanat space»", one: "Кто придёт", nth: "-й человек", rm: "Удалить", adult: "Взрослый", child: "Ребёнок (до 13 лет)",
none: "На этот день времени не осталось. Выберите другой день.", hello: "Здравствуйте, ", want: "! Хочу записаться.", dl: "Дата: ", tl: "Время: ", min: " мин", wl: "Кто придёт: ", nl: "Имя: ", pl: "Телефон: ", ok: "Подойдёт?",
a: " взрослый", c: " ребёнок", mn: "Мастер",
WD: ["вс", "пн", "вт", "ср", "чт", "пт", "сб"], WDF: ["воскресенье", "понедельник", "вторник", "среда", "четверг", "пятница", "суббота"],
MF: ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"] }
};
var LANG = "kk";
try { var sv = localStorage.getItem("bk-lang"); if (sv === "ru" || sv === "kk") LANG = sv; } catch (e) {}
function L() { return TX[LANG]; }
function applyLang() {
var t = L();
document.documentElement.lang = LANG === "ru" ? "ru" : "kk";
document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = t[el.getAttribute("data-t")]; });
$("name").placeholder = t.nph;
$("addr").textContent = t.addr;
document.querySelectorAll("#lang button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-l") === LANG)); });
}
var $ = function (id) { return document.getElementById(id); };
function pad(n) { return (n < 10 ? "0" : "") + n; }
function key(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function digits(s) { return (s || "").replace(/\D/g, ""); }
var m = (new URLSearchParams(location.search).get("m") || "").toLowerCase();
var st = { m: MASTERS[m] ? m : "", day: key(new Date()), time: "", pp: ["A"] };

function drawMaster() {
var mm = MASTERS[st.m];
$("pick").hidden = !!mm;
var box = $("masters"); box.innerHTML = "";
if (!mm) {
Object.keys(MASTERS).forEach(function (k) {
var b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = MASTERS[k].name;
b.onclick = function () { st.m = k; drawMaster(); update(); };
box.appendChild(b);
});
}
$("map").href = MAP_URL;
$("master").textContent = mm ? mm.name : L().mn;
$("tel").textContent = mm ? mm.phone : ""; $("tel").href = mm ? "tel:" + mm.phone : "#";
}
function drawPersons() {
var box = $("persons"); box.innerHTML = "";
st.pp.forEach(function (p, i) {
var row = document.createElement("div"); row.className = "person";
var head = document.createElement("div"); head.className = "prow";
var lb = document.createElement("div"); lb.className = "lbl"; lb.textContent = st.pp.length > 1 ? (i + 1) + L().nth : L().one;
head.appendChild(lb);
if (i > 0) {
var rm = document.createElement("button"); rm.type = "button"; rm.className = "rm"; rm.textContent = L().rm;
rm.onclick = function () { st.pp.splice(i, 1); drawPersons(); };
head.appendChild(rm);
}
row.appendChild(head);
var chips = document.createElement("div"); chips.className = "chips";
[["A", L().adult], ["C", L().child]].forEach(function (o) {
var b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = o[1];
b.setAttribute("aria-pressed", String(p === o[0]));
b.onclick = function () { st.pp[i] = o[0]; drawPersons(); };
chips.appendChild(b);
});
row.appendChild(chips); box.appendChild(row);
});
$("addp").hidden = st.pp.length >= MAX_PERSONS;
drawDays();
}
function drawDays() {
var box = $("days"); box.innerHTML = "";
var today = new Date();
for (var i = 0; i < 14; i++) {
var d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
var b = document.createElement("button");
b.className = "day"; b.type = "button"; b.dataset.k = key(d);
b.setAttribute("aria-pressed", String(st.day === key(d)));
b.innerHTML = "<small>" + L().WD[d.getDay()] + "</small><strong>" + d.getDate() + "</strong><small>" + L().MF[d.getMonth()].slice(0, 3) + "</small>";
b.onclick = function () { st.day = this.dataset.k; st.time = ""; drawDays(); };
box.appendChild(b);
}
drawTimes();
}
function drawTimes() {
var box = $("times"); box.innerHTML = "";
var now = new Date(), isToday = st.day === key(now), nowMin = now.getHours() * 60 + now.getMinutes();
var need = st.pp.length * 30, any = false;
var mm = MASTERS[st.m] || {}, dp = st.day.split("-"), dow = new Date(+dp[0], +dp[1] - 1, +dp[2]).getDay();
var hrs = (dow === 0 || dow === 6 || isHol(st.day)) ? (mm.we || [9, 22]) : (mm.wk || [9, 22]);
var lo = hrs[0] * 60, hi = hrs[1] * 60;
if ((mm.off || []).indexOf(st.day) >= 0) hi = lo;
for (var t = lo; t + need <= hi; t += 30) {
if (isToday && t < nowMin + 30) continue;
var s = pad(Math.floor(t / 60)) + ":" + pad(t % 60), b = document.createElement("button");
b.className = "chip"; b.type = "button"; b.textContent = s;
b.setAttribute("aria-pressed", String(st.time === s));
b.onclick = function () { st.time = this.textContent; drawTimes(); };
box.appendChild(b); any = true;
}
if (!any) box.innerHTML = "<p class='note'>" + L().none + "</p>";
update();
}
function update() {
var mm = MASTERS[st.m], name = $("name").value.trim(), phone = $("phone").value.trim();
var ok = mm && st.time && name.length >= 2 && digits(phone).length >= 10;
var go = $("go");
go.setAttribute("aria-disabled", String(!ok));
go.style.opacity = ok ? "1" : ".45";
if (!ok) { go.removeAttribute("href"); return; }
var p = st.day.split("-"), dt = new Date(+p[0], +p[1] - 1, +p[2]);
var a = st.pp.filter(function (x) { return x === "A"; }).length, c = st.pp.length - a, who = [];
var t = L(); if (a) who.push(a + t.a); if (c) who.push(c + t.c);
var txt = t.hello + mm.name + t.want + "\n" + t.dl + dt.getDate() + " " + t.MF[dt.getMonth()] + ", " + t.WDF[dt.getDay()] +
"\n" + t.tl + st.time + " (" + st.pp.length * 30 + t.min + ")\n" + t.wl + who.join(" + ") +
"\n" + t.nl + name + "\n" + t.pl + phone + "\n" + t.ok;
go.href = "https://wa.me/" + digits(mm.phone) + "?text=" + encodeURIComponent(txt);
go.target = "_blank"; go.rel = "noopener";
}
$("name").oninput = update; $("phone").oninput = update;
$("addp").onclick = function () { if (st.pp.length < MAX_PERSONS) { st.pp.push("C"); st.time = ""; drawPersons(); } };
document.querySelectorAll("#lang button").forEach(function (b) {
b.onclick = function () { LANG = b.getAttribute("data-l"); try { localStorage.setItem("bk-lang", LANG); } catch (e) {} applyLang(); drawMaster(); drawPersons(); };
});
applyLang(); drawMaster(); drawPersons();
</script>
</body>
</html>
