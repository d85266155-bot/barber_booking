<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шаштаразға жазылу</title>
<meta name="theme-color" content="#0e0f12">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>:root{--font-display:"Space Grotesk",system-ui,-apple-system,sans-serif;--font-body:"Inter",system-ui,-apple-system,sans-serif;--bg:#0e0f12;--surface:#17181c;--surface2:#22242a;--fg:#ececec;--muted:#a6a8b0;--line:#2a2c33;--gold:#d4af37;--on-gold:#1a1500;--gold-soft:#3a3115;--gold-text:#f3dd8a;--wa:#25d366;--on-wa:#07210f;--danger:#ff6b6b;color-scheme:dark;}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}html{background:var(--bg);}body{margin:0;background:var(--bg);color:v
ar(--fg);font:15px/1.45 var(--font-body);padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(40px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));}[hidden]{display:none !important;}main{max-width:480px;margin:0 auto;display:grid;gap:16px;}h1{margin:0;font:700 28px/1.15 var(--font-display);color:var(--gold);letter-spacing:-.01em;text-wrap:balance;}.sub{margin:4px 0 
0;color:var(--muted);}.box{background:var(--surface);border-radius:20px;padding:16px;display:grid;gap:12px;min-width:0;}.lbl{font-size:13px;color:var(--muted);font-weight:500;}.chips{display:flex;flex-wrap:wrap;gap:8px;}.chip{min-height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:transparent;font:inherit;color:var(--fg);cursor:pointer;font-variant-numeric:tabular-nums;}.chip[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold-text);border-color:va
r(--gold);}.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}.strip::-webkit-scrollbar{display:none;}.day{flex:none;border:0;border-radius:16px;background:var(--surface2);color:var(--fg);padding:10px 14px;text-align:center;min-width:58px;font:inherit;cursor:pointer;}.day small{display:block;font-size:12px;color:var(--muted);}.day strong{font:700 18px var(--font-display);}.day[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);}.day[aria-pressed="t
rue"] small{color:var(--on-gold);}input[type="text"],input[type="tel"]{width:100%;min-height:48px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:0 12px;font:16px var(--font-body);color:var(--fg);}:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}.send{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:16px;background:var(--wa);color:var(--on-wa);font:700 17px 
var(--font-display);text-decoration:none;}.send[aria-disabled="true"]{opacity:.4;pointer-events:none;}.preview{white-space:pre-wrap;background:var(--surface2);border-radius:12px;padding:12px;font-size:14px;color:var(--muted);}.warn{background:#3a1f1f;color:var(--danger);border-radius:14px;padding:12px 14px;font-size:14px;}.note{margin:0;font-size:12px;color:var(--muted);}.err{background:#3a1f1f;color:var(--danger);border-radius:14px;padding:12px 
14px;font-size:14px;}.ok{background:#1c3a26;color:#9be3b0;border-radius:14px;padding:16px;font-size:16px;}.btn{display:flex;align-items:center;justify-content:center;min-height:54px;border:0;border-radius:16px;background:var(--gold);color:var(--on-gold);font:700 17px var(--font-display);cursor:pointer;width:100%;}.btn:disabled{opacity:.4;cursor:default;}.chip.off{display:none;}.person{display:grid;gap:8px;padding:10px 
12px;border-radius:14px;background:var(--surface2);}.prow{display:flex;align-items:center;justify-content:space-between;gap:8px;}.link{background:none;border:0;color:var(--gold-text);font:inherit;cursor:pointer;padding:6px 0;text-align:left;}.rm{margin-left:auto;background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;min-height:40px;padding:0 8px;}.total{background:var(--gold-soft);color:var(--gold-text);border-radius:12px;padding:10px 
12px;font-size:14px;}.red{color:#ff4d4d;font-weight:700;font-size:15px;background:#3a1f1f;border-radius:14px;padding:12px 14px;margin:0;}.info{display:grid;gap:6px;font-size:14px;}.info a{color:var(--gold-text);}</style>
</head>
<body>
<main>
<header>
<h1 id="title">Шаштаразға жазылу</h1>
<p class="sub">Күн мен уақытты таңдаңыз. Батырманы басқанда шеберге WhatsApp-та хабар ашылады. Жазылу шебер растағаннан кейін күшіне енеді.</p>
</header>
<p class="red">Келе алмайтын болсаңыз, шеберге алдын ала хабарласыңыз!</p>
<section class="box" id="pick" hidden>
<div class="lbl">Шебер</div>
<div class="chips" id="masters"></div>
</section>
<div id="form" style="display:grid;gap:16px">
<section class="box">
<div class="lbl">Кім келеді?</div>
<div id="persons" style="display:grid;gap:8px"></div>
<button class="link" id="addp" type="button">+ Тағы адам қосу</button>
</section>
<section class="box">
<div class="lbl">Күні</div>
<div class="strip" id="days"></div>
<div class="lbl">Қалаған уақыт</div>
<div class="chips" id="times"></div>
</section>
<section class="box">
<label class="lbl" style="display:grid;gap:6px">Атыңыз
<input type="text" id="name" autocomplete="name" placeholder="Мысалы, Нұрлан" maxlength="50">
</label>
<label class="lbl" style="display:grid;gap:6px">Телефоныңыз
<input type="tel" id="phone" autocomplete="tel" placeholder="8 777 123 45 67" maxlength="20">
</label>
